name: GitHub Pages yönlendirmesi

# Uygulama artık Oracle sunucusunda çalışıyor (bkz. DEPLOY.md).
# Pages sadece eski linki yeni adrese yönlendirir. Adres değişirse repo değişkeni
# APP_URL ile (Settings → Secrets and variables → Actions → Variables) ezilebilir.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Yönlendirme sayfasını hazırla
        env:
          APP_URL: ${{ vars.APP_URL || 'https://okey-101.duckdns.org' }}
        run: |
          test -n "$APP_URL" || { echo "APP_URL repo değişkeni tanımlı değil"; exit 1; }
          sed -i "s#__APP_URL__#${APP_URL%/}#g" pages-redirect/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './pages-redirect'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
